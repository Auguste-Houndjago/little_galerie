<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #container {
            position: relative;
            width: 300px;
            height: 200px;
            border: 1px solid #ccc;
        }

        .draggable {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            cursor: grab;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="draggable" id="health"></div>
        <div class="draggable" id="food"></div>
    </div>

    <script>
        const healthDiv = document.getElementById('health');
        const foodDiv = document.getElementById('food');

        let offsetX, offsetY;
        let isDragging = false;

        healthDiv.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - healthDiv.getBoundingClientRect().left;
            offsetY = e.clientY - healthDiv.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const newX = e.clientX - offsetX;
            const newY = e.clientY - offsetY;

            healthDiv.style.left = `${newX}px`;
            healthDiv.style.top = `${newY}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
